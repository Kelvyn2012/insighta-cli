[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insighta-cli"
version = "0.1.0"
description = "Command-line interface for Insighta Labs+"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
insighta = "insighta_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 127
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
