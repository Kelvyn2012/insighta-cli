[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "insighta-cli"
version = "0.1.0"
description = "Command-line interface for Insighta Labs+"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
insighta = "insighta_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 127
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
